{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<h2 class="mb-3">Add New Student</h2>
<form method="POST" class="card card-body shadow-sm">
    <label class="form-label">Student Name</label>
    <input type="text" name="name" maxlength="100" class="form-control mb-3" required>
    <label class="form-label">Email Address</label>
    <input type="email" name="email" maxlength="120" class="form-control mb-3" required>
    <label class="form-label">Phone Number</label>
    <input type="text" name="phone" maxlength="15" class="form-control mb-3">
    <label class="form-label">Course</label>
    <input type="text" name="course" maxlength="100" class="form-control mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" maxlength="255" class="form-control mb-3" rows="3"></textarea>
    <div><button type="submit" class="btn btn-success">Save Student</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a></div>
</form>
{% endblock %}
